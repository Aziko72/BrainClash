name: Build Android APK (BrainClash)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.22.x'
        channel: 'stable'

    - name: Setup and Build Flutter APK
      run: |
        set -e
        echo "=== Yangi toza loyiha yaratilmoqda ==="
        flutter create --org com.brainclash.app --platforms android brain_clash_app
        cd brain_clash_app
        
        echo "=== Kutubxonalar o'rnatilmoqda ==="
        flutter pub add provider google_fonts http
        
        echo "=== Kodlar ko'chirilmoqda ==="
        LIB_SRC=$(find .. -type d -path "*/lib" | head -n 1)
        if [ -d "$LIB_SRC" ]; then
          cp -r "$LIB_SRC"/* lib/
        fi
        
        echo "=== Release APK yig'ilmoqda ==="
        flutter build apk --release --no-tree-shake-icons
        
        mkdir -p ../dist
        cp build/app/outputs/flutter-apk/app-release.apk ../dist/BrainClash-v1.0-Release.apk
        echo "=== Yig'ish yakunlandi ==="

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: BrainClash-Release-APK
        path: dist/BrainClash-v1.0-Release.apk
