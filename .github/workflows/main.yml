name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.x'
        channel: 'stable'

    - name: Build APK
      run: |
        APP_DIR=$(python3 -c "import os; [print(root) for root, dirs, files in os.walk('.') if 'pubspec.yaml' in files and 'build' not in root][:1]")
        echo "Loyiha papkasi: $APP_DIR"
        cd "$APP_DIR"
        
        # Android tizim fayllarini avtomatik yaratish
        if [ ! -d "android" ]; then
          echo "Android platforma fayllari yaratilmoqda..."
          flutter create . --platforms=android --org=com.brainclash.app
        fi
        
        flutter pub get
        flutter build apk --release --no-tree-shake-icons

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: BrainClash-Release-APK
        path: "**/build/app/outputs/flutter-apk/app-release.apk"
